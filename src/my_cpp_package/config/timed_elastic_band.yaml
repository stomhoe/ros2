scheduler:
  realtime:
    enabled: false
  timing:
    spin_before_deadline: 500us

blocks:
  - name: pose_input
    type: bpe_ros_boundary_plugins/RosInputBlock
    config:
      topic: /bug2/pose
      ros_type: geometry_msgs/msg/PoseStamped
      blackboard_output: robot_pose
      qos_depth: 10

  - name: scan_input
    type: bpe_ros_boundary_plugins/RosInputBlock
    config:
      topic: /bug2/scan
      ros_type: sensor_msgs/msg/LaserScan
      blackboard_output: obstacle_scan
      qos_depth: 10

  - name: timed_elastic_band
    type: my_cpp_package/TimedElasticBandBlock
    execution:
      policy: timer
      period: 50ms
    config:
      pose_input: robot_pose
      scan_input: obstacle_scan
      command_output: robot_command
      markers_output: teb_markers
      frame: world
      goal_x: 4.0
      goal_y: 0.0
      max_linear_speed: 0.35
      max_angular_speed: 1.0
      obstacle_clearance: 0.55
      goal_tolerance: 0.15
      pose_timeout: 0.5
      scan_timeout: 0.5
      node_count: 14
      optimization_steps: 35
      time_step: 0.25

  - name: command_output
    type: bpe_ros_boundary_plugins/RosOutputBlock
    execution:
      policy: timer
      period: 50ms
    config:
      topic: /bug2/cmd_vel
      ros_type: geometry_msgs/msg/TwistStamped
      blackboard_input: robot_command
      qos_depth: 10

  - name: marker_output
    type: bpe_ros_boundary_plugins/RosOutputBlock
    execution:
      policy: timer
      period: 50ms
    config:
      topic: /bug2/markers
      ros_type: visualization_msgs/msg/MarkerArray
      blackboard_input: teb_markers
      qos_depth: 10
