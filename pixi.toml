[workspace]
channels = ["robostack-humble", "conda-forge"]
name = "my_ros2_project"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
rviz = "rviz2 -d src/my_cpp_package/config/rviz.rviz"
pure-pursuit-bpe = "ros2 launch my_cpp_package pure_pursuit.launch.py"
bug2-bpe = "ros2 launch my_cpp_package bug2.launch.py"
bug2-standalone = "ros2 launch my_cpp_package bug2.launch.py config:=bug2_standalone.yaml"
build = "colcon build --symlink-install"

[activation]
scripts = ["install/local_setup.sh"]

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
ros-humble-ament-cmake-auto = ">=1.3.14,<2"
compilers = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-humble-rviz2 = ">=11.2.26,<12"
